<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오답노트 - 내 인생 정리</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#4f46e5">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <nav class="navbar">
    <a href="/" class="nav-link">오늘 체크인</a>
    <a href="/calendar.html" class="nav-link">캘린더</a>
    <a href="/diary.html" class="nav-link">일기</a>
    <a href="/history.html" class="nav-link">활동 이력</a>
    <a href="/wrongnotes.html" class="nav-link active">오답노트</a>
  </nav>

  <header class="topbar">
    <h1>오답노트</h1>
    <p class="hint">틀린 문제를 등록해두고 모아서 다시 풀어보세요.</p>
  </header>

  <main>
    <section class="card">
      <h2>풀어보기</h2>
      <div id="quizEmpty" class="hint" hidden>등록된 문제가 없어요. 아래에서 문제를 추가해보세요.</div>
      <div id="quizArea" hidden>
        <div class="quiz-progress">
          <span id="quizProgress"></span>
          <span id="quizScore"></span>
        </div>
        <div id="quizSource" class="quiz-source"></div>
        <div id="quizQuestion" class="quiz-question"></div>
        <div id="quizContext" class="quiz-context"></div>
        <div id="quizChoices" class="quiz-choices"></div>
        <div id="quizExplanation" class="quiz-explanation" hidden></div>
        <div class="quiz-actions">
          <button id="quizNextBtn" class="save-btn" hidden>다음 문제</button>
        </div>
      </div>
      <div id="quizDone" class="quiz-done" hidden>
        <p id="quizResult"></p>
        <div class="quiz-actions">
          <button id="quizRetryAll" class="btn-secondary">전체 다시 풀기</button>
          <button id="quizRetryWrong" class="btn-secondary" hidden>틀린 문제만 다시 풀기</button>
        </div>
      </div>
    </section>

    <section class="card">
      <h2>문제 추가</h2>
      <div class="activity-form">
        <div>
          <label for="fSource">출처 (선택)</label>
          <input type="text" id="fSource" placeholder="예: 2021년 09월 12일 기출문제 94번">
        </div>
        <div>
          <label for="fQuestion">문제 *</label>
          <textarea id="fQuestion" rows="3" placeholder="문제 지문을 입력하세요"></textarea>
        </div>
        <div>
          <label for="fContext">보기/조건 (선택)</label>
          <textarea id="fContext" rows="3" placeholder="표나 추가 조건이 있으면 입력하세요"></textarea>
        </div>
        <div>
          <label>선택지 * (정답 라디오 버튼 선택)</label>
          <div id="choiceRows" class="choice-rows"></div>
          <button id="addChoiceBtn" class="btn-secondary" type="button" style="margin-top:6px;">선택지 추가</button>
        </div>
        <div>
          <label for="fExplanation">해설 (선택)</label>
          <textarea id="fExplanation" rows="3" placeholder="풀이 및 해설을 입력하세요"></textarea>
        </div>
      </div>
      <button id="addBtn" class="save-btn">오답노트에 추가</button>
      <span id="addStatus" class="save-status"></span>
    </section>

    <section class="card">
      <h2>전체 목록 (<span id="listCount">0</span>)</h2>
      <div id="noteList" class="activity-list"></div>
    </section>
  </main>
</div>

<script src="pwa.js"></script>
<script src="wrongnotes.js"></script>
</body>
</html>
